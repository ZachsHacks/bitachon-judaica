<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitachon Judaica, Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FAF9F4;--navy:#2B5C99;--gold:#B8923D;--ink:#26303C;--soft:#5a626d;--line:#e2dccd}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:"Jost",system-ui,sans-serif;font-size:16px;line-height:1.6}
  h1,h2,h3{font-family:"Playfair Display",serif;font-weight:600;color:var(--navy)}
  .wrap{max-width:900px;margin:0 auto;padding:28px 22px}
  header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
  header .brand{display:flex;align-items:center;gap:12px}
  header img{height:46px}
  header .t{font-family:"Playfair Display",serif;font-size:20px;color:var(--navy)}
  button{font-family:"Jost";cursor:pointer;border:0;border-radius:6px;padding:11px 20px;font-size:14px;letter-spacing:.04em}
  .primary{background:var(--navy);color:#fff}
  .ghost{background:transparent;color:var(--navy);border:1px solid var(--navy)}
  .danger{background:transparent;color:#a33;border:1px solid #d9b3b3;padding:7px 12px;font-size:13px}
  label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:16px 0 6px}
  input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:6px;padding:11px 13px;font-family:"Jost";font-size:15px;outline:none}
  textarea{min-height:90px;resize:vertical}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:22px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .msg{margin-top:12px;font-size:14px}
  .msg.err{color:#b23}.msg.ok{color:#2a7}
  #login{max-width:360px;margin:60px auto}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .item{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .item .ph{aspect-ratio:4/3;background:#f0ede4;overflow:hidden}
  .item .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .item .body{padding:12px 14px}
  .item h3{font-size:17px}
  .item .cat{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
  .item .price{color:var(--navy);font-family:"Playfair Display",serif;margin-top:2px}
  .item .acts{display:flex;gap:8px;margin-top:10px}
  .item .acts button{padding:6px 12px;font-size:13px}
  .off{opacity:.5}
  #preview{max-width:160px;border-radius:6px;margin-top:8px;display:none}
  .hint{font-size:12px;color:var(--soft);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img src="/assets/logo.png" alt=""><span class="t">Bitachon Judaica, Admin</span></div>
    <button class="ghost" id="logout" style="display:none">Log out</button>
  </header>

  <div id="login" class="card">
    <h2 style="margin-bottom:6px">Log in</h2>
    <p class="hint">Enter the admin password.</p>
    <label>Password</label>
    <input type="password" id="pw" autocomplete="current-password">
    <div style="margin-top:16px"><button class="primary" id="loginBtn">Log in</button></div>
    <div class="msg err" id="loginMsg"></div>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <h2 id="formTitle">Add a product</h2>
      <div class="row">
        <div><label>Name</label><input id="f_name" placeholder="e.g. Lotus Havdalah Holder"></div>
        <div><label>Category</label><select id="f_category"></select></div>
      </div>
      <div class="row">
        <div><label>Price (optional)</label><input id="f_price" placeholder="e.g. $96"></div>
        <div>
          <label>Available</label>
          <select id="f_available"><option value="true">Available</option><option value="false">Sold out / hidden</option></select>
        </div>
      </div>
      <label>Description (optional)</label>
      <textarea id="f_description" placeholder="A few words about the piece"></textarea>
      <label>Photo</label>
      <input type="file" id="f_photo" accept="image/*">
      <div class="hint">Photos are shrunk automatically so the site stays fast.</div>
      <img id="preview" alt="preview">
      <div style="margin-top:18px;display:flex;gap:10px">
        <button class="primary" id="saveBtn">Save product</button>
        <button class="ghost" id="cancelBtn" style="display:none">Cancel edit</button>
      </div>
      <div class="msg" id="saveMsg"></div>
    </div>

    <h2 style="margin:6px 0 14px">Products</h2>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let CATS = [], editingId = null, imageData = null;

const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, method, body){
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined});
  return {ok:r.ok, status:r.status, data: await r.json().catch(()=>({}))};
}

async function boot(){
  const s = await api('/api/session','GET');
  CATS = s.data.categories || [];
  $('f_category').innerHTML = CATS.map(c=>`<option>${esc(c)}</option>`).join('');
  if(s.data.authed){ showApp(); } else { $('login').style.display='block'; }
}
function showApp(){ $('login').style.display='none'; $('app').style.display='block'; $('logout').style.display='inline-block'; loadList(); }

$('loginBtn').onclick = async () => {
  $('loginMsg').textContent='';
  const r = await api('/api/login','POST',{password:$('pw').value});
  if(r.ok) showApp(); else $('loginMsg').textContent = r.data.error || 'Login failed';
};
$('pw').addEventListener('keydown', e => { if(e.key==='Enter') $('loginBtn').click(); });
$('logout').onclick = async () => { await api('/api/logout','POST'); location.reload(); };

// shrink photo client-side to max 1400px, jpeg
$('f_photo').addEventListener('change', e => {
  const file = e.target.files[0]; if(!file) return;
  const img = new Image();
  img.onload = () => {
    const max=1400, scale=Math.min(1, max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    imageData = c.toDataURL('image/jpeg', 0.85);
    $('preview').src = imageData; $('preview').style.display='block';
  };
  img.src = URL.createObjectURL(file);
});

$('saveBtn').onclick = async () => {
  $('saveMsg').textContent='';
  const body = {
    id: editingId || undefined,
    name: $('f_name').value, category: $('f_category').value,
    price: $('f_price').value, description: $('f_description').value,
    available: $('f_available').value === 'true',
    imageData: imageData || undefined,
  };
  const r = await api('/api/products','POST',body);
  if(!r.ok){ $('saveMsg').className='msg err'; $('saveMsg').textContent = r.data.error || 'Save failed'; return; }
  $('saveMsg').className='msg ok'; $('saveMsg').textContent='Saved.';
  resetForm(); loadList();
};
$('cancelBtn').onclick = resetForm;

function resetForm(){
  editingId=null; imageData=null;
  $('f_name').value=''; $('f_price').value=''; $('f_description').value='';
  $('f_available').value='true'; $('f_photo').value=''; $('preview').style.display='none';
  $('formTitle').textContent='Add a product'; $('cancelBtn').style.display='none'; $('saveMsg').textContent='';
}
function edit(p){
  editingId=p.id; imageData=null;
  $('f_name').value=p.name||''; $('f_category').value=p.category||CATS[0];
  $('f_price').value=p.price||''; $('f_description').value=p.description||'';
  $('f_available').value = p.available===false ? 'false':'true';
  $('preview').src=p.image||''; $('preview').style.display=p.image?'block':'none';
  $('formTitle').textContent='Edit product'; $('cancelBtn').style.display='inline-block';
  window.scrollTo({top:0,behavior:'smooth'});
}
async function del(p){
  if(!confirm('Delete "'+p.name+'"?')) return;
  await api('/api/products/delete','POST',{id:p.id}); loadList();
}

async function loadList(){
  const r = await api('/api/products','GET');
  const list = r.data || [];
  $('list').innerHTML = list.length ? list.map(p=>`
    <div class="item ${p.available===false?'off':''}">
      <div class="ph">${p.image?`<img src="${esc(p.image)}">`:''}</div>
      <div class="body">
        <div class="cat">${esc(p.category)}</div>
        <h3>${esc(p.name)}</h3>
        ${p.price?`<div class="price">${esc(p.price)}</div>`:''}
        <div class="acts"><button class="ghost" data-e="${p.id}">Edit</button><button class="danger" data-d="${p.id}">Delete</button></div>
      </div>
    </div>`).join('') : '<p style="color:var(--soft)">No products yet. Add your first above.</p>';
  $('list').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(list.find(x=>x.id===b.dataset.e)));
  $('list').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>del(list.find(x=>x.id===b.dataset.d)));
}
boot();
</script>
</body>
</html>
